import_blueprint:
  name: Blueprint importieren
  description: Importiert einen oder alle Blueprints von wohnsinnigvernetzt.de direkt in Home Assistant.
  fields:
    url:
      name: Blueprint-URL (optional)
      description: Direkte YAML-URL. Leer lassen, um den ausgewählten Blueprint zu importieren.
      required: false
      selector:
        text:
    import_all:
      name: Alle Blueprints importieren
      description: Aktivieren, um alle gefundenen Blueprints auf einmal zu importieren.
      required: false
      default: false
      selector:
        boolean:

mark_episode_seen:
  name: Neue Folge als gesehen markieren
  description: Bestätigt die aktuell neueste Folge und setzt den Sensor „Neue Folge verfügbar“ zurück auf NEIN.
