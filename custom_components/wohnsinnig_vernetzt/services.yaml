send_feedback:
  name: Feedback senden
  description: Sendet eine Feedback-Nachricht oder einen Themenwunsch an Wohnsinnig vernetzt.
  fields:
    message:
      name: Nachricht
      description: Dein Feedback oder Themenwunsch für den Podcast.
      required: true
      example: "Tolle Folge zu Automationen! Macht gerne mal was zu WLED."
      selector:
        text:
          multiline: true
    sender:
      name: Name (optional)
      description: Dein Name oder Spitzname.
      required: false
      example: "Max"
      selector:
        text:
    episode:
      name: Folge (optional)
      description: Titel der Folge, auf die sich das Feedback bezieht.
      required: false
      selector:
        text:
