import_blueprint:
  name: Blueprint importieren
  description: Importiert einen oder alle Blueprints von wohnsinnigvernetzt.de direkt in Home Assistant.
  fields:
    url:
      name: Blueprint-URL (optional)
      description: Direkte YAML-URL. Leer lassen, um den ausgewählten Blueprint zu importieren.
      required: false
      selector:
        text:
    import_all:
      name: Alle Blueprints importieren
      description: Aktivieren, um alle gefundenen Blueprints auf einmal zu importieren.
      required: false
      default: false
      selector:
        boolean:

mark_episode_seen:
  name: Neue Folge als gesehen markieren
  description: Bestätigt die aktuell neueste Folge und setzt den Sensor „Neue Folge verfügbar“ zurück auf NEIN.

run_battery_check:
  name: Batterie-Check ausführen
  description: Prüft lokal alle Batterien unter der eingestellten Grenze (Standard 15 %) und listet alle betroffenen Geräte auf.
  fields:
    notify:
      name: Geräteliste als HA-Benachrichtigung anzeigen
      description: Zeigt alle Geräte mit schwacher Batterie direkt in den Home-Assistant-Benachrichtigungen an.
      required: false
      default: false
      selector:
        boolean:

run_silent_sensors_check:
  name: Stille Sensoren prüfen
  description: Prüft lokal alle physischen Sensoren auf Zigbee-Freeze (keine Meldung seit mehr als der eingestellten Stundenzahl).
  fields:
    notify:
      name: Liste als HA-Benachrichtigung anzeigen
      description: Zeigt alle stillen Sensoren direkt in den Home-Assistant-Benachrichtigungen an.
      required: false
      default: false
      selector:
        boolean:

reset_battery_push_memory:
  name: Batterie-Push-Speicher zurücksetzen
  description: Setzt die Anti-Spam-Sperre zurück, sodass aktuell schwache Batterien beim nächsten Check erneut per Push gemeldet werden.

exclude_battery_device:
  name: Gerät vom Batterie-Check ausschließen
  description: Schließt ein bestimmtes Gerät (oder eine Batterie-Entität) dauerhaft vom Batterie-Check und Batterie-Push aus.
  fields:
    device_id:
      name: Gerät (optional)
      description: Wähle das Gerät, das nicht mehr im Batterie-Check erscheinen soll.
      required: false
      selector:
        device:
    entity_id:
      name: Batterie-Entität (optional)
      description: Alternativ kannst du direkt die Batterie-Entität auswählen.
      required: false
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: battery

include_battery_device:
  name: Gerät wieder in Batterie-Check aufnehmen
  description: Entfernt ein zuvor ausgeschlossenes Gerät wieder von der Ausschlussliste.
  fields:
    device_id:
      name: Gerät (optional)
      description: Das Gerät, das wieder überwacht werden soll.
      required: false
      selector:
        device:
    entity_id:
      name: Batterie-Entität (optional)
      description: Alternativ die Batterie-Entität auswählen.
      required: false
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: battery
